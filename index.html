<!DOCTYPE html>
<html lang="en">

<head>
    <link rel='stylesheet' href='normalase.css'>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexo</title>
</head>

<body>
    <header >
        <div class="container">

            <div class="header__inner">

                
                <div class="header-top">
                    
                    <img src="images/logo.png" alt="logo" class="logo">
                    <div class="title">
                        <p class="sub_text">-Shop, where you can find everithing</p>
                    </div>
                    <div class="searchbar">
                        <input type="text" class="searchbar_input" placeholder="Search">
                        <button class="search_button">
                            <img src="images/seacchbutton.svg" alt="" class="search_img">
                        </button>
                    </div>
                </div>
                
                
                <nav class="nav">
                    
                    <a class="nav__link">
                        <img src="images/shopping_bag_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="" class="bucket_img"> Basket
                    </a>
                    
                    
                    <div class="dropdown">
                        <button class="dropdown__button" id="button">
                            <img src="images/menu_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="catalog" class="cataloge_img">Catalog
                        </button>

                        <div class="dropdown__menu">
                            <a href="" class="dropdown__link">Clothers</a>
                            <a href="" class="dropdown__link">Toys</a>
                            <a href="" class="dropdown__link">Accessories</a>
                            <a href="" class="dropdown__link">Other</a>
                        </div>
                    </div>
                    
                    
                    <a class="nav__link">
                        <img src="images/cards_stack_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="cards" class="cards_img"> Cards
                    </a>
                    
                    <a class="nav__link">
                        <img src="images/person_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="icon" class="user_img"> Log in
                    </a>
                </nav>
                
            </div>
        </div>
    </header>
    <main class="mainpart">

        <section class="intro">

            <div class="intro_aside">
                <h1>Spring Sale</h1>
                <h2>Discount on any product from 10%</h2>
            </div>
        </section>

        <section class="catalogue">
            <div class="container">
                <h3 class="catalogue_title">Catalogue</h3>
                <div class="catalogue_items">
                  

                </div>
            </div>
        </section>
        
        
           
    </main>
    <footer></footer>
</body>

</html>
